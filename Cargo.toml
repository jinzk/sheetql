[package]
name = "sheetql"
authors = ["jinzk"]
version = "0.1.0"
edition = "2024"
description = "A tool to run SQL-like query on xls, xlsx and csv files"
license = "MIT"
repository = "https://github.com/amrdeveloper/sheetql/"
documentation = "https://github.com/amrdeveloper/sheetql"
readme = "README.md"
keywords = ["cli", "sql", "xlsx", "xls", "csv", "sheetql"]
categories = ["command-line-utilities"]
exclude = [".github/**", "docs/**", "media/**", "scripts/**"]

[dependencies]
sqlparser = "0.62"
calamine = "0.36"
csv = "1.3"
chrono = "0.4"
serde_json = "1"
serde_yaml = "0.9"
unicode-width = "0.2.2"
